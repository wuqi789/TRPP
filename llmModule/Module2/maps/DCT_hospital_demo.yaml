# Runtime copy of an external historical scene export.
# Keep both files semantically identical; test_map_matches_scene_export guards drift.

ontology:
  hospital: {aliases: [hospital scene, hospital ward, 医院]}
  jackal: {aliases: [jackal robot, robot, 杰卡尔机器人]}
  wheelchair: {aliases: [wheel chair, mobility chair, 轮椅]}
  supply_cart: {aliases: [supply cart, medical supply trolley, supply trolley, 补给车, 医疗推车]}
  disposal_stand: {aliases: [disposal stand, waste stand, disposal station, 废物处理架]}
  wet_floor_sign: {aliases: [wet floor sign, caution sign, 小心地滑牌]}
  chair: {aliases: [seat, 椅子]}
  hospital_bed: {aliases: [hospital bed, medical bed, 病床]}
  trashcan: {aliases: [trash can, bin, waste bin, 垃圾桶]}
  cracker_box:
    aliases:
      [cracker box, biscuit box, biscuit carton, biscuit cartoncracker box, 饼干盒, 饼干纸箱]
